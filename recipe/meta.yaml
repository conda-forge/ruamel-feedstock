package:
  name: ruamel
  version: "1.0"

build:
  number: 13
  script:
    # conda-build derives SP_DIR from the platform alone, so on Windows it still
    # says %PREFIX%\Lib\site-packages after 3.15 moved site-packages to
    # %PREFIX%\lib\python\site-packages (conda-forge/python-feedstock#860).
    # Ask sysconfig for the layout of the python being built against instead.
    - python -c "import os,sysconfig;p=os.environ['PREFIX'];d=os.path.join(sysconfig.get_path('purelib',vars={'base':p,'platbase':p,'installed_base':p,'installed_platbase':p}),'ruamel');os.makedirs(d,exist_ok=True);open(os.path.join(d,'__init__.py'),'w').close()"
    - {{ PYTHON }} -c "import ruamel"   # [build_platform == target_platform]

requirements:
  build:
    - python

  host:
    - python

  run:
    - python

test:
  imports:
    - ruamel

about:
  home: http://github.com/conda-forge/ruamel-feedstock
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A package to ensure the `ruamel` namespace is available.

extra:
  recipe-maintainers:
    - jakirkham
